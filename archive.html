<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2025 Archive · Jimmy's Page!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="archive.css">
</head>
<body>

<header class="a-header">
  <a href="index.html" class="a-home-link">← Jimmy's Page!</a>
  <h1 class="a-title">2025 Archive</h1>
  <p class="a-subtitle">180 wishes, scroll and find yours...</p>
</header>

<main>

  <section id="viewWall" class="a-wall-wrap">
    <div id="wallGrid" class="a-wall-grid"></div>
  </section>

  <section id="viewDetail" class="a-detail-wrap" style="display:none;">

    <button id="backBtn" class="a-back-btn" aria-label="Back to wall">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </button>

    <div class="a-detail-grid">

      <div class="a-detail-main">
        <img id="bigImage" class="a-big-image" src="" alt="Postcard">

        <div class="a-actions">
          <button id="likeBtn" class="a-action-btn">
            <svg id="likeIcon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"></path></svg>
            <span id="likeCount">0</span>
          </button>

          <div class="a-share-wrap">
            <button id="shareBtn" class="a-action-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"></line><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line></svg>
              <span>Share</span>
            </button>
            <div id="shareMenu" class="a-share-menu">
              <button id="downloadOpt">Download photo</button>
              <button id="shareLinkOpt">Share link</button>
            </div>
          </div>
        </div>
      </div>

      <div class="a-more">
        <div id="moreGrid" class="a-more-grid"></div>
      </div>

    </div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="archive.js"></script>
</body>
</html>
